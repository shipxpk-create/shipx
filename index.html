function openStaffSalary(staffId){ if(!canDo('view_staff_salaries')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === staffId); if(!s) return; if(!s.salaryPayments) s.salaryPayments = []; const canEdit = canDo('edit_staff'); const baseSalary = parseFloat(s.salary) || 0; const allowTotal = (s.allowances || []).reduce((a,b) => a + (parseFloat(b.amount) || 0), 0); const totalMonthly = baseSalary + allowTotal; const now = new Date(); const months = []; for(let i = 0; i < 24; i++){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); } const paidMap = {}; (s.salaryPayments || []).forEach(p => { if(p.month) paidMap[p.month] = p; }); const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const rows = months.map(m => { const parts = m.split('-'); const label = monthNames[parseInt(parts[1], 10) - 1] + ' ' + parts[0]; const payment = paidMap[m]; const isPaid = !!payment; const actions = isPaid ? (canEdit ? `<div class="actions-cell"><button class="btn-icon" onclick="editSalaryPayment('${s.id}','${payment.id}')" title="Edit payment">${svgIcon('edit', 15)}</button><button class="btn-icon danger" onclick="deleteSalaryPayment('${s.id}','${payment.id}')" title="Delete record">${svgIcon('x', 15)}</button></div>` : '') : (canEdit ? `<button class="btn-icon" onclick="markSalaryPaid('${s.id}','${m}')" title="Mark as paid">${svgIcon('check', 15)}</button>` : ''); return `<tr><td class="mono"><b>${label}</b></td><td class="num">${fmt(totalMonthly)}</td><td>${isPaid ? '<span class="badge b-green">' + svgIcon('check', 11) + 'Paid</span>' : '<span class="badge b-amber">Unpaid</span>'}</td><td class="mono small">${isPaid ? fmtDate(payment.paidDate) : '—'}</td><td>${actions}</td></tr>`; }).join(''); const totalPaid = (s.salaryPayments || []).reduce((a,b) => a + (parseFloat(b.amount) || 0), 0); openModal('Salary — ' + s.name, `<div class="kpi-grid">${kpi('Base Salary', fmt(baseSalary), '', 'teal', 'money')}${kpi('Allowances', fmt(allowTotal), (s.allowances || []).length + ' items', 'gold', 'layers')}${kpi('Total / Month', fmt(totalMonthly), '', 'lime', 'money')}${kpi('Total Paid', fmt(totalPaid), (s.salaryPayments || []).length + ' months', 'teal', 'checkCircle')}</div><div class="card-title">${svgIcon('calendar', 18)}Monthly Salary Payments (last 24 months)</div><div class="tbl-wrap scroll-y"><table style="min-width:auto"><thead><tr><th>Month</th><th class="num">Amount</th><th>Status</th><th>Paid Date</th><th style="width:120px">Actions</th></tr></thead><tbody>${rows}</tbody></table></div><div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`, 'wide'); }
function markSalaryPaid(staffId, month){ if(!canDo('edit_staff')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === staffId); if(!s) return; if(!s.salaryPayments) s.salaryPayments = []; if(s.salaryPayments.some(p => p.month === month)){ toast('Already marked as paid', 'err'); return; } const baseSalary = parseFloat(s.salary) || 0; const allowTotal = (s.allowances || []).reduce((a,b) => a + (parseFloat(b.amount) || 0), 0); const total = baseSalary + allowTotal; s.salaryPayments.push({ id: 'SP' + Date.now().toString(36) + Math.random().toString(36).slice(2,4), month, amount: total, paidDate: todayStr(), note: '' }); logAudit('salary_paid', 'Marked ' + month + ' salary paid for ' + s.name); saveState(); refresh(); openStaffSalary(staffId); renderPage(); toast('Marked as paid', 'ok'); }
function editSalaryPayment(staffId, paymentId){ if(!canDo('edit_staff')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === staffId); if(!s) return; const p = (s.salaryPayments || []).find(x => x.id === paymentId); if(!p) return; document.getElementById('modalBody').innerHTML = `<div class="info-note teal">${svgIcon('info', 18)}<div><b>Month:</b> ${esc(p.month)} · <b>Staff:</b> ${esc(s.name)}</div></div><div class="form-grid"><div class="field"><label>Amount Paid (PKR) *</label><input type="number" id="editSalAmount" value="${p.amount}" min="0"></div><div class="field"><label>Paid Date</label><div class="date-with-today"><input type="date" id="editSalDate" value="${p.paidDate || todayStr()}">${todayBtn('editSalDate')}</div></div><div class="field" style="grid-column:1/-1"><label>Note (optional)</label><input type="text" id="editSalNote" value="${esc(p.note || '')}" placeholder="e.g. Bonus included, etc."></div></div><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="openStaffSalary('${staffId}')">Cancel</button><button class="btn lime" onclick="saveEditedSalaryPayment('${staffId}','${paymentId}')">${svgIcon('check', 14)}Save Changes</button></div>`; }
function saveEditedSalaryPayment(staffId, paymentId){ if(!canDo('edit_staff')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === staffId); if(!s) return; const p = (s.salaryPayments || []).find(x => x.id === paymentId); if(!p) return; const amount = parseFloat(document.getElementById('editSalAmount')?.value) || 0; if(amount <= 0){ toast('Amount must be > 0', 'err'); return; } p.amount = amount; p.paidDate = document.getElementById('editSalDate')?.value || todayStr(); p.note = (document.getElementById('editSalNote')?.value || '').trim(); saveState(); refresh(); openStaffSalary(staffId); renderPage(); toast('Payment updated', 'ok'); }
function deleteSalaryPayment(staffId, paymentId){ if(!canDo('edit_staff')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === staffId); if(!s) return; const p = (s.salaryPayments || []).find(x => x.id === paymentId); if(!p) return; confirmSmartDelete({ title: 'Delete Salary Record', subject: esc(s.name) + ' · ' + p.month + ' · ' + fmt(p.amount), message: 'This will remove the payment record.', impacts: [{ type: 'warn', text: 'Payment history for <b>' + p.month + '</b> will be removed.' }], confirmLabel: 'Yes, Delete', onConfirm: () => { s.salaryPayments = (s.salaryPayments || []).filter(x => x.id !== paymentId); saveState(); refresh(); openStaffSalary(staffId); renderPage(); toast('Record deleted', 'ok'); } }); }
function deleteStaff(id){ if(!canDo('delete_staff')){ denyPerm(); return; } const s = STATE.staff.find(x => x.id === id); if(!s) return; const monthlySalary = parseFloat(s.salary) || 0; const allowTotal = (s.allowances || []).reduce((a,b) => a + (parseFloat(b.amount) || 0), 0); const payments = s.salaryPayments || []; const impacts = []; if(monthlySalary + allowTotal > 0) impacts.push({ type: 'warn', text: 'Monthly cost of <b>' + fmt(monthlySalary + allowTotal) + '</b> will be removed from fixed costs.' }); if(payments.length > 0) impacts.push({ type: 'danger', text: '<b>' + payments.length + '</b> salary payment record(s) will be permanently deleted.' }); if(impacts.length === 0) impacts.push({ type: 'info', text: 'No financial impact.' }); confirmSmartDelete({ title: 'Delete Staff', subject: esc(s.name) + ' · ' + esc(s.role || '—'), message: 'This action cannot be undone.', impacts: impacts, confirmLabel: 'Yes, Delete', onConfirm: () => { STATE.staff = STATE.staff.filter(x => x.id !== id); saveState(); refresh(); renderPage(); toast('Staff deleted', 'ok'); } }); }

t.remaining))}</b></td><td>${r.st.isPaid ? `<span class="badge b-green">${svgIcon('check', 11)}Paid</span>` : (r.st.received > 0 ? `<span class="badge b-amber">${svgIcon('info', 11)}Partial</span>` : `<span class="badge b-red">${svgIcon('alert', 11)}Unpaid</span>`)}</td><td><div class="actions-cell">${rateBtn}${editBtn}${delBtn}</div></td></tr>`;}).join('')}</tbody></table></div></div>`;

function renderOwnVsThird(){
  if(!canDo('view_ownvsthird')) return cardLocked('Own vs Partner');
  const canSeeFin = canDo('view_ownvsthird_financials');
  const ownShips = ENGINE.computed.filter(s=>s.fulfillmentType==='OWN');
  const tpShips = ENGINE.computed.filter(s=>s.fulfillmentType==='THIRD_PARTY');
  const own = totals(ownShips); const tp = totals(tpShips);
  const ownPerParcel = own.count > 0 ? own.contribution / own.count : 0;
  const tpPerParcel = tp.count > 0 ? tp.contribution / tp.count : 0;
  const winner = ownPerParcel >= tpPerParcel ? 'own' : 'third';
  const ownPct = own.count + tp.count > 0 ? (own.count / (own.count + tp.count)) * 100 : 0;
  const tpPct = 100 - ownPct;
  const heroCard = (title, t, perParcel, iconName, gradient, isWinner, tagline) => { const isProfit = t.contribution >= 0; return `<div style="background:${gradient};border-radius:18px;padding:28px 30px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(31,42,55,.18)">${isWinner ? `<div style="position:absolute;top:16px;right:16px;background:rgba(176,217,0,.25);color:var(--lime);padding:5px 12px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:5px">${svgIcon('check', 11)}WINNER</div>` : ''}<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px"><div style="width:52px;height:52px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center">${svgIcon(iconName, 24)}</div><div><div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700">${title}</div><div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:3px">${tagline}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.7px">Total Profit</div><div style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:${isProfit ? 'var(--lime)' : '#FF8F80'};margin-top:4px">${fmt(t.contribution)}</div></div><div><div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.7px">Per Parcel</div><div style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:${perParcel >= 0 ? 'var(--lime)' : '#FF8F80'};margin-top:4px">${fmt(perParcel)}</div></div></div><div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px"><div><div style="color:rgba(255,255,255,.65);font-weight:600">Revenue</div><div style="font-weight:700;font-size:14px;margin-top:2px">${fmt(t.totalRevenue)}</div></div><div><div style="color:rgba(255,255,255,.65);font-weight:600">Costs</div><div style="font-weight:700;font-size:14px;margin-top:2px">${fmt(t.direct)}</div></div></div></div>`; };

function exportTaxCSV(){ if(!canDo('view_tax')){ denyPerm(); return; } const buckets = {}; ENGINE.computed.forEach(s => { if(!s.bookingDate) return; const m = s.bookingDate.slice(0,7); if(!buckets[m]) buckets[m] = { count:0, revenue:0, gst:0, codSelf:0, codPartner:0 }; buckets[m].count++; buckets[m].revenue += s.shippingRevenue || 0; buckets[m].gst += s.gstPayable || 0; buckets[m].codSelf += s.codRetained || 0; buckets[m].codPartner += s.codPassThrough || 0; }); const months = Object.keys(buckets).sort(); if(!months.length){ toast('No data to export','err'); return; } const headers = ['Month','Shipments','Revenue (excl. GST)','GST (SHIPX Pays)','COD WHT (SHIPX Pays)','COD WHT (Partner Pays on Behalf)']; const rows = months.map(m => [m, buckets[m].count, buckets[m].revenue.toFixed(2), buckets[m].gst.toFixed(2), buckets[m].codSelf.toFixed(2), buckets[m].codPartner.toFixed(2)]); const total = ['TOTAL', months.reduce((a,m)=>a+buckets[m].count,0), months.reduce((a,m)=>a+buckets[m].revenue,0).toFixed(2), months.reduce((a,m)=>a+buckets[m].gst,0).toFixed(2), months.reduce((a,m)=>a+buckets[m].codSelf,0).toFixed(2), months.reduce((a,m)=>a+buckets[m].codPartner,0).toFixed(2)]; rows.push(total); downloadCSV(headers, rows, 'shipx-tax-filing-' + todayStr()); logAudit('tax_export', 'Exported tax filing CSV'); toast('Tax filing CSV downloaded', 'ok'); }

  const totalExpected = rows.reduce((a,b) => a + b.expected, 0); const totalActual = rows.reduce((a,b) => a + b.actual, 0); const totalDiff = totalActual - totalExpected;
  const fullyMatched = rows.filter(r => Math.abs(r.diff) < 1).length; const underpaid = rows.filter(r => r.diff < -1).length; const overpaid = rows.filter(r => r.diff > 1).length;
  return `${renderDateBar()}<div class="section-head"><h3>${svgIcon('bank', 20)}Bank Match</h3></div><div class="card" style="background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 100%);border:2px solid #93C5FD;margin-bottom:20px"><div class="card-title" style="color:#1D4ED8"><div class="title-left">${svgIcon('info', 18)}How Bank Match Works</div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px"><div style="background:#fff;border-radius:12px;padding:16px 18px;border-left:4px solid var(--teal)"><div style="font-size:10.5px;font-weight:800;color:var(--teal-dark);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px">1. Expected</div><div style="font-size:13px;color:#334155;line-height:1.5">Amount <b>ShipX owes</b> merchant from all delivered shipments. Calculated automatically from COD and fees.</div></div><div style="background:#fff;border-radius:12px;padding:16px 18px;border-left:4px solid var(--pos)"><div style="font-size:10.5px;font-weight:800;color:var(--pos);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px">2. Received</div><div style="font-size:13px;color:#334155;line-height:1.5">Amount <b>ShipX has actually paid</b> merchant (recorded here or auto from shipments marked as "Paid").</div></div><div style="background:#fff;border-radius:12px;padding:16px 18px;border-left:4px solid var(--gold)"><div style="font-size:10.5px;font-weight:800;color:#B45309;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px">3. Difference</div><div style="font-size:13px;color:#334155;line-height:1.5">Gap between what was expected vs paid. <b style="color:var(--pos)">+ = overpaid</b> · <b style="color:var(--neg)">− = still owed</b> · <b style="color:var(--teal-dark)">0 = matched ✓</b></div></div></div></div><div class="kpi-grid">${canSeeExpected ? kpi('Total Expected', fmt(totalExpected), 'ShipX owes merchants', 'teal', 'wallet') : kpiLocked('Total Expected')}${canSeeReceived ? kpi('Total Received', fmt(totalActual), 'Already paid', 'lime', 'checkCircle') : kpiLocked('Total Received')}${canSeeExpected && canSeeReceived ? kpi('Difference', fmt(totalDiff), totalDiff >= 0 ? 'Overpaid' : 'Still owed', totalDiff >= 0 ? 'pos' : 'neg', 'swap') : kpiLocked('Difference')}${kpi('Fully Matched', fullyMatched + ' / ' + rows.length, underpaid + ' underpaid · ' + overpaid + ' overpaid', 'teal', 'target')}</div><div class="card"><div class="card-title"><div class="title-left">${svgIcon('bank', 18)}Merchant-wise Reconciliation</div></div>${rows.length === 0 ? '<div class="info-note warn">No merchant data yet.</div>' : `<div style="display:flex;flex-direction:column;gap:12px">${rows.map(r => { const isMatched = Math.abs(r.diff) < 1; const isOver = r.diff > 1; const isUnder = r.diff < -1; const statusLabel = isMatched ? 'Matched ✓' : (isOver ? 'Overpaid' : 'Still Owed'); const statusBg = isMatched ? '#DCFCE7' : (isOver ? '#DBEAFE' : '#FEE2E2'); const statusColor = isMatched ? '#15803D' : (isOver ? '#1D4ED8' : '#B91C1C'); const borderColor = isMatched ? 'var(--pos)' : (isOver ? 'var(--blue)' : 'var(--neg)'); const progress = r.expected > 0 ? Math.min(100, (r.actual/r.expected)*100) : 100; const actBtn = canRecord ? `<button class="btn lime sm" onclick="openBankPaymentForm('${r.m.id}')">${svgIcon('plus', 13)}Record Payment</button>` : ''; return `<div style="background:#F8FAFC;border-radius:14px;padding:18px 20px;border-left:4px solid ${borderColor}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div style="display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--teal);border:1.5px solid var(--border)">${svgIcon('store', 18)}</div><div><div style="font-size:14.5px;font-weight:800;color:var(--slate)">${esc(r.m.name)}</div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">${r.list.length} delivered shipment${r.list.length>1?'s':''} · ${r.payments.length} payment${r.payments.length!==1?'s':''} recorded</div></div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="background:${statusBg};color:${statusColor};border:1.5px solid ${statusColor}40;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:800">${statusLabel}</span>${actBtn}</div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px"><div style="background:#fff;border-radius:10px;padding:12px 14px;border:1px solid var(--border)"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Expected</div><div style="font-size:18px;font-weight:800;color:var(--teal-dark);font-variant-numeric:tabular-nums;margin-top:3px">${fmt(r.expected)}</div></div><div style="background:#fff;border-radius:10px;padding:12px 14px;border:1px solid var(--border)"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Received</div><div style="font-size:18px;font-weight:800;color:var(--pos);font-variant-numeric:tabular-nums;margin-top:3px">${fmt(r.actual)}</div></div><div style="background:#fff;border-radius:10px;padding:12px 14px;border:1px solid var(--border)"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Difference</div><div style="font-size:18px;font-weight:800;color:${r.diff >= 0 ? 'var(--pos)' : 'var(--neg)'};font-variant-numeric:tabular-nums;margin-top:3px">${r.diff >= 0 ? '+' : ''}${fmt(r.diff)}</div></div></div><div style="height:8px;background:#E5E9F0;border-radius:5px;overflow:hidden"><div style="height:100%;width:${progress}%;background:${borderColor};border-radius:5px;transition:width .8s var(--ease)"></div></div><div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:6px">${progress.toFixed(1)}% matched${isMatched ? ' — Perfect ✓' : (isOver ? ' — Overpaid by ' + fmt(r.diff) : ' — Still owes ' + fmt(Math.abs(r.diff)))}</div></div>`; }).join('')}</div>`}</div>`;
}
function openBankPaymentForm(merchantId){ if(!canDo('view_bank')){ denyPerm(); return; } const m = STATE.merchants.find(x => x.id === merchantId); if(!m) return; const canAdd = canDo('add_bank_payment'); const canEdit = canDo('edit_bank_payment'); const canDelete = canDo('delete_bank_payment'); const allPayments = (STATE.bankPayments || []).filter(p => p.merchantId === merchantId).sort((a,b) => (b.date||'').localeCompare(a.date||'')); openModal('Bank Payments — ' + m.name, `<div class="info-note teal">${svgIcon('info', 18)}Merchant: <b>${esc(m.name)}</b><br>Payments auto-update the shipment "ShipX Paid?" status</div>${canAdd ? `<div class="card-title" style="margin-top:8px">${svgIcon('plus', 16)}Record New Payment</div><div class="form-grid"><div class="field"><label>Amount (PKR)</label><input type="number" id="bpAmount" step="0.01"></div><div class="field"><label>Bank Ref</label><input type="text" id="bpReference"></div><div class="field"><label>Date</label><div class="date-with-today"><input type="date" id="bpDate" value="${todayStr()}">${todayBtn('bpDate')}</div></div><div class="field"><label>Note</label><input type="text" id="bpNote"></div></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn lime" onclick="addBankPayment('${merchantId}')">${svgIcon('plus', 14)}Add Payment</button></div>` : ''}${allPayments.length > 0 ? `<div class="card-title" style="margin-top:28px">${svgIcon('receipt', 16)}All Payments (${allPayments.length})</div><div class="tbl-wrap"><table style="min-width:auto"><thead><tr><th>Date</th><th class="num">Amount</th><th>Ref</th><th style="width:120px">Actions</th></tr></thead><tbody>${allPayments.map(p => { const isAuto = p.isAuto || (p.reference && p.reference.startsWith('AUTO:')); const eBtn = canEdit && !isAuto ? `<button class="btn-icon" onclick="editBankPayment('${p.id}','${merchantId}')" title="Edit">${svgIcon('edit', 15)}</button>` : ''; const dBtn = canDelete ? `<button class="btn-icon danger" onclick="deleteBankPayment('${p.id}','${merchantId}')" title="Delete">${svgIcon('x', 15)}</button>` : ''; return `<tr><td class="mono">${fmtDate(p.date)}</td><td class="num"><b>${fmt(p.amount)}</b></td><td class="mono small">${p.reference ? esc(p.reference) : '—'}${isAuto ? ' <span class="badge b-teal" style="font-size:9px">AUTO</span>' : ''}</td><td><div class="actions-cell">${eBtn}${dBtn}</div></td></tr>`; }).join('')}</tbody></table></div>` : ''}<div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`, 'wide'); }
function addBankPayment(merchantId){ if(!canDo('add_bank_payment') && !canDo('record_bank_payment')){ denyPerm(); return; } const amount = parseFloat(document.getElementById('bpAmount')?.value) || 0; const reference = document.getElementById('bpReference')?.value.trim() || ''; const date = document.getElementById('bpDate')?.value || todayStr(); const note = document.getElementById('bpNote')?.value.trim() || ''; if(!amount){ toast('Amount required', 'err'); return; } if(!STATE.bankPayments) STATE.bankPayments = []; STATE.bankPayments.push({ id: nextId('BP-', STATE.bankPayments, 3), merchantId, amount, reference, date, note, recordedAt: new Date().toISOString() }); saveState(); closeModal(); renderPage(); toast('Recorded', 'ok'); }
function editBankPayment(paymentId, merchantId){ if(!canDo('edit_bank_payment') && !canDo('record_bank_payment')){ denyPerm(); return; } const p = (STATE.bankPayments || []).find(x => x.id === paymentId); if(!p) return; document.getElementById('modalBody').innerHTML = `<div class="form-grid"><div class="field"><label>Amount</label><input type="number" id="bpEditAmount" value="${p.amount}"></div><div class="field"><label>Ref</label><input type="text" id="bpEditReference" value="${esc(p.reference||'')}"></div><div class="field"><label>Date</label><div class="date-with-today"><input type="date" id="bpEditDate" value="${p.date}">${todayBtn('bpEditDate')}</div></div></div><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="openBankPaymentForm('${merchantId}')">Cancel</button><button class="btn lime" onclick="saveEditedBankPayment('${paymentId}','${merchantId}')">${svgIcon('check', 14)}Save</button></div>`; }
function saveEditedBankPayment(paymentId, merchantId){ if(!canDo('edit_bank_payment') && !canDo('record_bank_payment')){ denyPerm(); return; } const p = (STATE.bankPayments || []).find(x => x.id === paymentId); if(!p) return; p.amount = parseFloat(document.getElementById('bpEditAmount')?.value) || 0; p.reference = document.getElementById('bpEditReference')?.value.trim() || ''; p.date = document.getElementById('bpEditDate')?.value || todayStr(); saveState(); openBankPaymentForm(merchantId); renderPage(); toast('Updated', 'ok'); }
function deleteBankPayment(paymentId, merchantId){ if(!canDo('delete_bank_payment') && !canDo('record_bank_payment')){ denyPerm(); return; } const p = (STATE.bankPayments || []).find(x => x.id === paymentId); if(!p) return; confirmSmartDelete({ title: 'Delete Bank Payment', subject: fmt(p.amount) + ' · ' + fmtDate(p.date), message: 'This action cannot be undone.', impacts: [{ type:'danger', text:'Received amount will decrease by <b>' + fmt(p.amount) + '</b>.' }], confirmLabel: 'Yes, Delete', onConfirm: () => { STATE.bankPayments = (STATE.bankPayments || []).filter(x => x.id !== paymentId); saveState(); closeModal(); if(merchantId) openBankPaymentForm(merchantId); else renderPage(); toast('Payment deleted', 'ok'); } }); }

let SCENARIO = { volume: 3000, successRate: 83, avgRevenue: 500, avgPickupCost: 55, avgDeliveryCost: 105, avgThirdPartyCost: 300, avgReattemptCost: 20, avgRtoCost: 90, overhead: 335000, ownPct: 60, thirdPct: 40 };
function scenarioCalc(s){ const vol = s.volume || 0; const ownVol = vol * (s.ownPct || 0) / 100; const thirdVol = vol * (s.thirdPct || 0) / 100; const revenue = vol * (s.avgRevenue || 0); const direct = vol * (s.avgPickupCost || 0) + ownVol * (s.avgDeliveryCost || 0) + thirdVol * (s.avgThirdPartyCost || 0) + vol * (s.avgReattemptCost || 0) * 0.15 + (vol - vol * (s.successRate || 0) / 100) * (s.avgRtoCost || 0); const contribution = revenue - direct; const opProfit = contribution - (s.overhead || 0); return { vol, ownVol, thirdVol, revenue, direct, contribution, opProfit }; }
function scenarioSensitivity(s){ return [0.5, 0.75, 1, 1.25, 1.5, 2, 3].map(m => { const v = Math.round((s.volume || 0) * m); const ss = { ...s, volume: v }; const c = scenarioCalc(ss); return { label: (v/1000).toFixed(1)+'k', value: c.opProfit }; }); }
function renderScenarios(){ if(!canDo('view_scenarios')) return cardLocked('Growth Planner'); const canEdit = canDo('edit_scenarios'); const s = SCENARIO; const c = scenarioCalc(s); const sens = scenarioSensitivity(s); const isProfit = c.opProfit >= 0; const ro = canEdit ? '' : 'readonly'; const field = (key, label) => `<div class="field" style="margin:0"><label>${label}</label><input type="number" id="sc_${key}" value="${s[key]}" oninput="onScenarioInput('${key}', this.value)" ${ro}></div>`; return `<div class="section-head"><h3>${svgIcon('trending', 20)}Growth Planner</h3><button class="btn ghost" onclick="loadScenarioFromCurrent()">${svgIcon('refresh', 14)}Use My Numbers</button></div><div class="kpi-grid">${kpi('Projected ' + (isProfit?'Profit':'Loss'), fmt(c.opProfit), num(c.vol)+' parcels/mo', isProfit?'pos':'neg', 'trending')}${kpi('Revenue', fmt(c.revenue), '', '', 'money')}${kpi('Costs', fmt(c.direct), '', 'gold', 'money')}${kpi('Gross', fmt(c.contribution), '', c.contribution>0?'pos':'neg', 'money')}</div><div class="card"><div class="card-title">Assumptions</div><div class="form-grid">${field('volume','Monthly Shipments')}${field('successRate','Success %')}${field('ownPct','Own %')}${field('thirdPct','Partner %')}${field('avgRevenue','Avg Revenue')}${field('avgPickupCost','Pickup Cost')}${field('avgDeliveryCost','Own Delivery Cost')}${field('avgThirdPartyCost','Partner Cost')}${field('overhead','Monthly Expenses')}</div></div><div class="chart-card"><div class="chart-title">Net Profit vs Volume</div>${trendChart(sens, 600, 170, {color: isProfit?'var(--pos)':'var(--neg)'})}</div>`; }
function onScenarioInput(key, val){ if(!canDo('edit_scenarios')){ denyPerm(); return; } const n = parseFloat(val); SCENARIO[key] = isNaN(n) ? 0 : n; }
function loadScenarioFromCurrent(){ if(!canDo('edit_scenarios')){ denyPerm(); return; } const t = totals(ENGINE.computed); if(t.count === 0){ toast('No shipments', 'err'); return; } SCENARIO.volume = Math.round(t.count * (STATE.monthDays / ENGINE.periodDays)); SCENARIO.successRate = Math.round(t.successRate * 10) / 10; SCENARIO.avgRevenue = Math.round((t.totalRevenue / t.count) * 100) / 100; SCENARIO.avgPickupCost = Math.round((t.pickup / t.count) * 100) / 100; SCENARIO.avgDeliveryCost = t.own > 0 ? Math.round((t.delivery / t.own) * 100) / 100 : SCENARIO.avgDeliveryCost; SCENARIO.avgThirdPartyCost = t.thirdParty > 0 ? Math.round((t.third / t.thirdParty) * 100) / 100 : SCENARIO.avgThirdPartyCost; SCENARIO.ownPct = t.count ? Math.round(t.own / t.count * 100) : 60; SCENARIO.thirdPct = 100 - SCENARIO.ownPct; SCENARIO.overhead = Math.round(overheadMonthly() + staffMonthly() + riderAllowanceMonthly()); renderPage(); toast('Loaded', 'ok'); }

function renderCostMaster(){ if(!canDo('view_costmaster')) return cardLocked('Cost Categories'); const canAdd = canDo('add_cost_category'); const canEdit = canDo('edit_cost_category'); const canDelete = canDo('delete_cost_category'); return `<div class="section-head"><h3>${svgIcon('layers', 20)}Cost Categories</h3>${canAdd ? `<button class="btn lime" onclick="openCostCatForm()">${svgIcon('plus', 15)}Add Category</button>` : ''}</div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Category</th><th>Type</th><th>Basis</th><th style="width:120px">Actions</th></tr></thead><tbody>${STATE.costMaster.map(c=>{ const eBtn = canEdit?`<button class="btn-icon" onclick="openCostCatForm('${c.id}')" title="Edit">${svgIcon('edit', 15)}</button>`:''; const dBtn = canDelete?`<button class="btn-icon danger" onclick="deleteCostCat('${c.id}')" title="Delete">${svgIcon('x', 15)}</button>`:''; return `<tr><td class="mono">${esc(c.id)}</td><td><b>${esc(c.category)}</b></td><td>${esc(c.type)}</td><td>${esc(c.basis)}</td><td><div class="actions-cell">${eBtn}${dBtn}</div></td></tr>`; }).join('')}</tbody></table></div></div>`; }

async function forceUploadToCloud(){ if(!canDo('change_settings')){ denyPerm(); return; } if(!window.db || !CLOUD_READY){ toast('Firebase not initialized', 'err'); return; } toast('Uploading to cloud…', ''); try { await window.db.collection('shipx_finance_data').doc('main_state').set({ ...STATE, shipments: [] }); await window.db.collection('shipx_shipments').doc('all').set({ shipments: STATE.shipments, count: STATE.shipments.length, updatedAt: new Date().toISOString() }); setLastAutoSync(); toast('✓ Uploaded to Firebase successfully', 'ok'); updateCloudStatusUI('ok'); updateAutoSyncUI(); CLOUD_LAST_ERROR = ''; renderPage(); } catch(e){ console.error('Force upload error:', e); CLOUD_LAST_ERROR = e.code || e.message || 'unknown'; toast('Upload failed: ' + CLOUD_LAST_ERROR, 'err'); updateCloudStatusUI('err'); renderPage(); } }
async function forcePullFromCloud(){ if(!canDo('change_settings')){ denyPerm(); return; } if(!window.db || !CLOUD_READY){ toast('Firebase not initialized', 'err'); return; } if(!confirm('This will REPLACE all local data with Firebase cloud data.\n\nContinue?')) return; toast('Pulling from cloud…', ''); try { const metaSnap = await window.db.collection('shipx_finance_data').doc('main_state').get(); const shipSnap = await window.db.collection('shipx_shipments').doc('all').get(); if(!metaSnap.exists){ toast('No cloud data found', 'err'); return; } const cloudMeta = metaSnap.data() || {}; let ships = []; if(shipSnap.exists && Array.isArray(shipSnap.data().shipments)) ships = shipSnap.data().shipments; else if(Array.isArray(cloudMeta.shipments)) ships = cloudMeta.shipments; STATE = migrateState({ ...cloudMeta, shipments: ships }); saveState(); refresh(); renderPage(); toast('✓ Pulled from Firebase', 'ok'); } catch(e){ console.error('Force pull error:', e); toast('Pull failed: ' + (e.code || e.message || 'unknown'), 'err'); } }
async function testFirebaseConnection(){ if(!canDo('change_settings')){ denyPerm(); return; } if(!window.db || !CLOUD_READY){ toast('Firebase SDK not initialized', 'err'); return; } toast('Testing Firebase…', ''); try { const testData = { _test: true, at: new Date().toISOString(), by: currentUsername() }; await window.db.collection('shipx_finance_data').doc('_test').set(testData); const doc = await window.db.collection('shipx_finance_data').doc('_test').get(); if(doc.exists && doc.data()._test){ toast('✓ Firebase connected & writable — Everything is working!', 'ok'); updateCloudStatusUI('ok'); CLOUD_LAST_ERROR = ''; } else { toast('Read failed after write — check Firestore rules', 'err'); updateCloudStatusUI('err'); } renderPage(); } catch(e){ console.error('Firebase test error:', e); CLOUD_LAST_ERROR = e.code || e.message || 'unknown'; const msg = e.code === 'permission-denied' ? 'Firestore rules block access. Go to Firebase Console → Firestore → Rules and allow read/write.' : ('Firebase error: ' + CLOUD_LAST_ERROR); toast(msg, 'err'); updateCloudStatusUI('err'); renderPage(); } }
function resetAllData(){ if(!canDo('delete_data')){ denyPerm(); return; } confirmSmartDelete({ title: 'Reset ALL Data', subject: 'Complete system wipe', message: 'This action cannot be undone.', impacts: [{ type:'danger', text:'Everything will be erased.' }], confirmLabel: 'Yes, Reset Everything', onConfirm: () => { STATE = JSON.parse(JSON.stringify(EMPTY)); STATE.expenses = []; STATE.budgets = { revenue:0, variableCosts:0, fixedCosts:0, profit:0 }; saveState(); refresh(); renderPage(); toast('All data cleared', 'ok'); } }); }
function exportFullBackup(){ if(!canDo('download_backup') && !canDo('export_data')){ denyPerm(); return; } const data = { shipxBackup: true, version: VERSION, exportedAt: new Date().toISOString(), state: STATE }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'shipx-backup-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('Downloaded', 'ok'); }
function importBackup(input){ if(!canDo('restore_backup')){ denyPerm(); return; } const f = input.files[0]; if(!f) return; const r = new FileReader(); r.onload = e => { try { const data = JSON.parse(e.target.result); const st = data.state || data; if(!st || !Array.isArray(st.shipments)){ toast('Invalid file', 'err'); return; } if(!confirm('Replace ALL data?')) return; STATE = migrateState(st); saveState(); refresh(); renderPage(); toast('Restored', 'ok'); } catch(err){ toast('Could not read', 'err'); } }; r.readAsText(f); input.value = ''; }

function onServiceTypeChange(){ const st = document.querySelector('[name="serviceType"]')?.value; const hint = document.getElementById('serviceHintBox'); const codHint = document.getElementById('codHint'); if(hint){ hint.innerHTML = st === 'Replacement' ? '<b>Replacement:</b> New product given — keep COD at 0.' : '<b>COD:</b> Cash will be collected — fill COD amount.'; } if(codHint){ codHint.innerHTML = st === 'Replacement' ? '<span style="color:#92400E">Keep at 0 for replacement</span>' : 'No 4% COD on returns'; } previewShipment(); }
function onMerchantChange(){ const d = readFormData(); const b = merchantPriceBreakdown(d.merchantId, d.origin, d.destinationCity, d.verifiedWeight, d.fulfillmentType==='OWN'); const input = document.querySelector('[name="shippingRevenue"]'); if(input && b) input.value = Math.round(b.total); const rh = document.getElementById('revHint'); if(rh) rh.innerHTML = b ? ('Auto: ' + b.typeLabel + ' · ' + b.weight + ' kg → <b>PKR ' + Math.round(b.total) + '</b>') : 'Merchant rate not set'; if(d.fulfillmentType === 'THIRD_PARTY') onVendorChange(); else previewShipment(b, null); }
function onVendorChange(){ const d = readFormData(); const b = vendorPriceBreakdown(d.vendor, d.origin, d.destinationCity, d.verifiedWeight); const input = document.querySelector('[name="thirdPartyCost"]'); if(input && b) input.value = Math.round(b.total); const vh = document.getElementById('vendHint'); if(vh) vh.innerHTML = b ? ('Auto: ' + b.typeLabel + ' · ' + b.weight + ' kg → <b>PKR ' + Math.round(b.total) + '</b>') : ''; previewShipment(null, b); }
function onFulfillmentChange(){ const ft = document.querySelector('[name="fulfillmentType"]')?.value; const vf = document.getElementById('vendorField'); const tf = document.getElementById('tpCostField'); if(!vf || !tf) return; if(ft === 'THIRD_PARTY'){ vf.style.display = ''; tf.style.display = ''; } else { vf.style.display = 'none'; tf.style.display = 'none'; } }
function onStatusChange(){ const st = document.querySelector('[name="status"]')?.value; const df = document.getElementById('deliveryDateField'); if(!df) return; if(st === 'Delivered' || st === 'RTO'){ df.style.display = ''; const inp = df.querySelector('input'); if(inp && !inp.value) inp.value = todayStr(); } else { df.style.display = 'none'; } }
function previewShipment(){ const el = document.getElementById('shipPreview'); if(!el) return; const d = readFormData(); const rider = STATE.riders.find(r => r.id === d.riderId); const pickupCommission = rider ? (parseFloat(rider.pickupCommission) || 0) : 0; const deliveryCommission = rider ? (parseFloat(rider.deliveryCommission) || 0) : 0; const previewShipments = STATE.shipments.concat([{ merchantId: d.merchantId, bookingDate: d.bookingDate, status: d.status }]); const pickupFuelPerParcel = fcPerParcelForDate(d.bookingDate, previewShipments); const isOwnDelivered = (d.fulfillmentType === 'OWN' && (d.status === 'Delivered' || d.status === 'RTO')); const deliveryCost = isOwnDelivered ? deliveryCommission : 0; const thirdPartyCost = d.fulfillmentType === 'THIRD_PARTY' ? (parseFloat(d.thirdPartyCost) || 0) : 0; const otherDirectCost = (d.status === 'RTO') ? 0 : (parseFloat(d.otherDirectCost) || 0); const pickupCost = pickupFuelPerParcel + pickupCommission; const totalDirectCost = pickupCost + deliveryCost + thirdPartyCost + otherDirectCost; const shippingGross = parseFloat(d.shippingRevenue) || 0; const previewIsOwn = d.fulfillmentType === 'OWN'; const mc = STATE.merchantCharges || {}; const fuelR = (parseFloat(mc.fuelSurcharge) || 0) / 100; const gstR = (parseFloat(mc.gst) || 0) / 100; const div = (1 + fuelR) * (1 + gstR); const baseAmt = div > 0 ? shippingGross / div : shippingGross; const shippingNet = previewIsOwn ? (baseAmt + baseAmt * fuelR) : shippingGross; const totalRevenue = shippingNet; const contribution = totalRevenue - totalDirectCost; const contributionMargin = totalRevenue > 0 ? (contribution / totalRevenue) * 100 : 0; const isProfit = contribution >= 0; el.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px"><div style="background:linear-gradient(135deg,#F0FDF4 0%,#DCFCE7 100%);border:2px solid #86EFAC;border-radius:12px;padding:18px"><div style="font-size:11px;font-weight:700;color:var(--pos);text-transform:uppercase;margin-bottom:6px">Money In</div><div style="font-size:24px;font-weight:800;color:var(--pos)">${fmt(totalRevenue)}</div></div><div style="background:linear-gradient(135deg,#FEF2F2 0%,#FEE2E2 100%);border:2px solid #FCA5A5;border-radius:12px;padding:18px"><div style="font-size:11px;font-weight:700;color:var(--neg);text-transform:uppercase;margin-bottom:6px">Money Out</div><div style="font-size:24px;font-weight:800;color:var(--neg)">${fmt(totalDirectCost)}</div></div></div><div style="background:${isProfit?'linear-gradient(135deg,#F0FDF4,#DCFCE7)':'linear-gradient(135deg,#FEF2F2,#FEE2E2)'};border:2px solid ${isProfit?'#86EFAC':'#FCA5A5'};border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;font-weight:700;color:${isProfit?'var(--pos)':'var(--neg)'};text-transform:uppercase">${isProfit ? '✓ Profit' : '✗ Loss'}</div><div class="small" style="margin-top:2px">Margin ${pct(contributionMargin)}</div></div><div style="font-size:30px;font-weight:800;color:${isProfit?'var(--pos)':'var(--neg)'}">${isProfit?'+':''}${fmt(contribution)}</div></div>`; }
function validateRefId(inputEl){ if(!inputEl) return true; const val = String(inputEl.value || '').trim().toLowerCase(); const hint = document.getElementById('refIdHint'); const editingId = inputEl.dataset.editingId || ''; inputEl.style.borderColor = ''; inputEl.style.boxShadow = ''; if(hint){ hint.innerHTML = ''; hint.style.color = ''; hint.style.fontWeight = ''; } if(!val) return true; const duplicate = STATE.shipments.find(s => { if(!s.referenceId) return false; if(s.id === editingId) return false; return String(s.referenceId).trim().toLowerCase() === val; }); if(duplicate){ inputEl.style.borderColor = 'var(--neg)'; if(hint){ hint.innerHTML = '⚠ Already exists in ' + esc(duplicate.id); hint.style.color = 'var(--neg)'; hint.style.fontWeight = '700'; } return false; } if(hint){ hint.innerHTML = '✓ Available'; hint.style.color = 'var(--pos)'; hint.style.fontWeight = '600'; } return true; }
function saveShipment(id){
  const isEdit = !!id;
  if(isEdit && !canDo('edit_shipment')){ denyPerm(); return; }
  if(!isEdit && !canDo('add_shipment')){ denyPerm(); return; }
  const d = readFormData();
  if(d.referenceId && String(d.referenceId).trim()){ const refVal = String(d.referenceId).trim().toLowerCase(); const dup = STATE.shipments.find(s => { if(!s.referenceId) return false; if(s.id === id) return false; return String(s.referenceId).trim().toLowerCase() === refVal; }); if(dup){ toast('Reference ID already exists (Shipment: ' + dup.id + ')', 'err'); return; } }
  if(!d.merchantId){ toast('Merchant required', 'err'); return; }
  if(!(d.verifiedWeight > 0)){ toast('Weight must be > 0', 'err'); return; }
  if(!d.serviceType) d.serviceType = 'COD';
  if(!d.shipxPaymentStatus || d.shipxPaymentStatus === 'auto') d.shipxPaymentStatus = (d.status === 'RTO') ? 'adjusted' : 'unpaid';
  d.rto = d.status === 'RTO'; d.rtoCost = 0;
  let saved;
  if(id){ const idx = STATE.shipments.findIndex(x => x.id === id); if(idx >= 0){ STATE.shipments[idx] = { ...STATE.shipments[idx], ...d }; saved = STATE.shipments[idx]; } logAudit('shipment_update', 'Updated ' + id); }
  else { saved = { ...d, id: nextId('SX-', STATE.shipments, 4), trackingNumber: nextTracking() }; STATE.shipments.push(saved); logAudit('shipment_add', 'Added shipment'); }
  refresh();
  syncShipmentAutoBankPayment(saved);
  saveState(); refresh(); closeModal(); renderPage(); toast(id ? 'Updated' : 'Added', 'ok');
}

function openMerchantForm(id){ const isEdit = !!id; if(isEdit && !canDo('edit_merchant')){ denyPerm(); return; } if(!isEdit && !canDo('add_merchant')){ denyPerm(); return; } closeNewMenu(); const base = isEdit ? STATE.merchants.find(x=>x.id===id) : { name:'', city:'Karachi', joinDate: todayStr() }; if(!base) return; openModal(isEdit?'Edit Merchant':'Add Merchant', `<div class="form-grid"><div class="field"><label>Business Name *</label><input name="name" value="${esc(base.name)}" autofocus></div><div class="field"><label>City</label><input type="text" name="city" list="merchantCityList" value="${esc(base.city || 'Karachi')}"></div><div class="field"><label>Client Since</label><div class="date-with-today"><input type="date" name="joinDate" id="merchantJoinDate" value="${base.joinDate||todayStr()}">${todayBtn('merchantJoinDate')}</div></div></div><datalist id="merchantCityList">${cityOptionsHtml()}</datalist><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn lime" onclick="saveMerchant('${id||''}')">${svgIcon('check', 14)}${isEdit?'Update':'Add'}</button></div>`, 'wide'); }
function saveMerchant(id){ const isEdit = !!id; if(isEdit && !canDo('edit_merchant')){ denyPerm(); return; } if(!isEdit && !canDo('add_merchant')){ denyPerm(); return; } const d = readFormData(); if(!d.name?.trim()){ toast('Name required','err'); return; } if(id){ const idx = STATE.merchants.findIndex(x=>x.id===id); if(idx>=0) STATE.merchants[idx] = { ...STATE.merchants[idx], ...d }; logAudit('merchant_update', 'Updated'); } else { STATE.merchants.push({ ...d, id: nextId('M', STATE.merchants, 3), pricing: defaultPricing() }); logAudit('merchant_add', 'Added'); } saveState(); refresh(); closeModal(); renderPage(); toast(id?'Updated':'Added','ok'); }
function deleteMerchant(id){ if(!canDo('delete_merchant')){ denyPerm(); return; } const m = STATE.merchants.find(x => x.id === id); if(!m) return; const ships = STATE.shipments.filter(s => s.merchantId === id); if(ships.length > 0){ confirmSmartDelete({ title: 'Cannot Delete Merchant', subject: esc(m.name), message: 'This merchant still has linked shipments.', impacts: [{ type:'danger', text:'<b>' + ships.length + '</b> shipment(s) linked. Delete them first.' }], confirmLabel: 'OK', hideConfirm: true, onConfirm: () => {} }); return; } confirmSmartDelete({ title: 'Delete Merchant', subject: esc(m.name), message: 'This action cannot be undone.', impacts: [{ type:'info', text:'Safe to delete.' }], confirmLabel: 'Yes, Delete', onConfirm: () => { STATE.merchants = STATE.merchants.filter(x => x.id !== id); saveState(); refresh(); renderPage(); toast('Merchant deleted', 'ok'); } }); }
function openRiderForm(id){ const isEdit = !!id; if(isEdit && !canDo('edit_rider')){ denyPerm(); return; } if(!isEdit && !canDo('add_rider')){ denyPerm(); return; } closeNewMenu(); const base = isEdit ? STATE.riders.find(x=>x.id===id) : { name:'', pickupCommission:0, deliveryCommission:0, reattemptCommission:0, mobile:0, maintenance:0, other:0, city:'Karachi' }; if(!base) return; openModal(isEdit?'Edit Rider':'Add Rider', `<div class="form-grid"><div class="field"><label>Full Name *</label><input name="name" value="${esc(base.name)}" autofocus></div><div class="field"><label>City</label><input type="text" name="city" list="riderCityList" value="${esc(base.city || 'Karachi')}"></div><div class="field"><label>Pickup Commission (PKR)</label><input type="number" name="pickupCommission" value="${base.pickupCommission}" min="0"></div><div class="field"><label>Delivery Commission (PKR)</label><input type="number" name="deliveryCommission" value="${base.deliveryCommission}" min="0"></div><div class="field"><label>Re-attempt Commission (PKR)</label><input type="number" name="reattemptCommission" value="${base.reattemptCommission}" min="0"></div><div class="field"><label>Mobile Allowance</label><input type="number" name="mobile" value="${base.mobile||0}"></div><div class="field"><label>Maintenance</label><input type="number" name="maintenance" value="${base.maintenance||0}"></div><div class="field"><label>Other Allowance</label><input type="number" name="other" value="${base.other||0}"></div></div><datalist id="riderCityList">${cityOptionsHtml()}</datalist><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn lime" onclick="saveRider('${id||''}')">${svgIcon('check', 14)}${isEdit?'Update':'Add'}</button></div>`, 'narrow'); }
function saveRider(id){ const isEdit = !!id; if(isEdit && !canDo('edit_rider')){ denyPerm(); return; } if(!isEdit && !canDo('add_rider')){ denyPerm(); return; } const d = readFormData(); if(!d.name?.trim()){ toast('Name required','err'); return; } if(id){ const idx = STATE.riders.findIndex(x=>x.id===id); if(idx>=0) STATE.riders[idx] = { ...STATE.riders[idx], ...d }; logAudit('rider_update', 'Updated'); } else { STATE.riders.push({ ...d, id: nextId('R', STATE.riders, 3) }); logAudit('rider_add', 'Added'); } saveState(); refresh(); closeModal(); renderPage(); toast('Saved','ok'); }

ers[0]?.id || '', reattempts: 0, status: 'Pending', settlementStatus: 'Pending', serviceType: 'COD', shipxPaymentStatus: 'unpaid' }); imported++; } saveState(); refresh(); closeModal(); renderPage(); let msg = `Imported ${imported}`; if(createdMerchants) msg += ` · ${createdMerchants} new merchants`; if(skipped) msg += ` · ${skipped} skipped`; toast(msg, imported > 0 ? 'ok' : 'err'); }

(async function init(){
  const stored = loadState(); STATE = stored || JSON.parse(JSON.stringify(EMPTY));
  if(window.db){
    try {
      const metaSnap = await window.db.collection('shipx_finance_data').doc('main_state').get();
      const shipSnap = await window.db.collection('shipx_shipments').doc('all').get();
      if(metaSnap.exists){
        const cloudMeta = metaSnap.data() || {};
        let ships = null;
        if(shipSnap.exists && Array.isArray(shipSnap.data().shipments)) ships = shipSnap.data().shipments;
        else if(Array.isArray(cloudMeta.shipments) && cloudMeta.shipments.length > 0) ships = cloudMeta.shipments;
        if(ships !== null && ships.length > 0) { STATE = migrateState({ ...cloudMeta, shipments: ships }); console.log('✓ Loaded from Firebase: ' + ships.length + ' shipments'); }
        else if(STATE && Array.isArray(STATE.shipments) && STATE.shipments.length > 0) { STATE = migrateState({ ...cloudMeta, shipments: STATE.shipments }); _pendingPushUp = true; console.log('⚠ Cloud empty, keeping ' + STATE.shipments.length + ' local shipments'); }
        else { STATE = migrateState({ ...cloudMeta, shipments: [] }); console.log('✓ Loaded from Firebase: empty'); }
      }
    } catch(e){ console.error('Firestore load error:', e); CLOUD_LAST_ERROR = e.code || e.message; }
  }
  STATE = migrateState(STATE);
  const existingUser = getUsers().length > 0;
  if(!existingUser || !isLoggedIn()){ showSignInScreen(); } else { boot(); }
})();

  function pick(c){ if(!input) return; const el = input; el.value = c; close(); fire(el); el.blur(); }
  document.addEventListener('mousedown', e => { const t = e.target; if(t && t.matches && t.matches(SEL)){ t.removeAttribute('list'); t.setAttribute('data-cp','1'); } }, true);
  document.addEventListener('focusin', e => { const t = e.target; if(t && t.matches && t.matches(SEL)) open(t); });
  document.addEventListener('click', e => { const t = e.target; if(t && t.matches && t.matches(SEL) && !(panel && panel.classList.contains('show'))) open(t); });
  document.addEventListener('input', e => { if(e.target === input){ typed = true; render(); } });
  document.addEventListener('keydown', e => { if(!input) return; if(e.key === 'ArrowDown'){ e.preventDefault(); if(items.length){ idx = (idx+1) % items.length; paintActive(false); } } else if(e.key === 'ArrowUp'){ e.preventDefault(); if(items.length){ idx = (idx-1+items.length) % items.length; paintActive(false); } } else if(e.key === 'Enter'){ if(panel.classList.contains('show') && idx >= 0){ e.preventDefault(); pick(items[idx]); } } else if(e.key === 'Escape'){ e.stopPropagation(); input.value = prev; close(); } }, true);
  document.addEventListener('focusout', e => { if(e.target !== input) return; const el = input; const v = canon(el.value); if(v){ if(v !== el.value){ el.value = v; fire(el); } } else { el.value = prev; } close(); });
  window.addEventListener('resize', place); document.addEventListener('scroll', place, true);
})();
</script>
